# Guardar como: .github/workflows/devsecops.yml
# Basado en el Paso 3 del taller, con ajustes justificados (ver guía).
name: DevSecOps Complete Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# Mínimo privilegio: cada job pide solo lo que necesita.
permissions:
  contents: read

jobs:
  secret-scan:
    name: 1. Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-security:
    name: 2. Tests, SAST & SCA
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage --if-present
      - name: SAST Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --error --severity ERROR
      - name: SCA Trivy
        # TODO: reemplazar el tag por el SHA completo (40 caracteres) del release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  package-and-sign:
    name: 3. Container Build, Scan & Cosign
    needs: code-security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # necesario para la firma keyless (OIDC)
    outputs:
      image: ${{ steps.img.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre del repositorio en minúsculas
      - name: Normalizar nombre de la imagen
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          # Trazabilidad código-artefacto: la imagen guarda el commit exacto
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Scan imagen con Trivy
        # TODO: reemplazar el tag por el SHA completo (40 caracteres) del release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          severity: 'CRITICAL'
          exit-code: '1'

      # Extra (Syft aparece en las herramientas del taller y el SBOM en las preguntas)
      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json

      - uses: sigstore/cosign-installer@v3
      - name: Firmar imagen por digest
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  dast-staging:
    name: 4. DAST Scan
    needs: package-and-sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Levantar la imagen firmada
        run: |
          docker run -d --name app-staging -p 3000:3000 \
            "${{ needs.package-and-sign.outputs.image }}@${{ needs.package-and-sign.outputs.digest }}"
          for i in $(seq 1 20); do
            curl -fs http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          docker logs app-staging
          exit 1
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
          allow_issue_writing: false
